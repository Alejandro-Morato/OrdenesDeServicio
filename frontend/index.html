<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Inter Rural — Sistema de Órdenes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E8500A;--orange-hover:#C43F06;--orange-glow:rgba(232,80,10,0.15);
    --font:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    background:linear-gradient(135deg,#111,#1a1a1a);
    padding:20px;
  }
  .login-card{
    max-width:440px;width:100%;
    background:#1C1C1C;
    border:1px solid #2A2A2A;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 24px 64px rgba(0,0,0,0.45);
  }
  .card-accent{
    height:4px;
    background:linear-gradient(90deg,var(--orange),#FF7043,#2E7D32);
  }
  .card-inner{padding:40px;}
  .logos-row{
    display:flex;align-items:center;justify-content:center;
    gap:20px;margin-bottom:32px;
  }
  .logo-pill{
    background:#2A2A2A;
    border:1px solid #3D3D3D;
    border-radius:12px;
    padding:10px 20px;
  }
  .ir-name{
    font-size:15px;font-weight:900;
    letter-spacing:0.04em;color:#fff;
  }
  .ir-name span{color:var(--orange);}
  .card-heading{text-align:center;margin-bottom:32px;}
  .card-heading h1{
    font-size:1.5rem;font-weight:800;
    color:#fff;margin-bottom:6px;
  }
  .card-heading p{font-size:0.875rem;color:#8A8A8A;}
  .field{display:grid;gap:7px;margin-bottom:18px;}
  .field label{font-size:0.8rem;font-weight:600;color:#B0B0B0;}
  .field input{
    width:100%;height:48px;padding:0 14px;
    background:#2A2A2A;
    border:1.5px solid #3D3D3D;
    border-radius:10px;
    font-family:var(--font);font-size:0.9rem;
    color:#fff;outline:none;
    transition:all 0.18s;
  }
  .field input:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px var(--orange-glow);
  }
  .btn-login{
    width:100%;height:50px;
    border-radius:10px;
    background:var(--orange);
    color:white;
    font-family:var(--font);
    font-size:0.95rem;font-weight:700;
    border:none;cursor:pointer;
    box-shadow:0 4px 16px rgba(232,80,10,0.35);
    transition:all 0.2s;
  }
  .btn-login:hover{
    background:var(--orange-hover);
    transform:translateY(-1px);
  }
  .btn-login:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .error-msg{
    display:none;
    background:rgba(239,68,68,0.12);
    border:1px solid rgba(239,68,68,0.3);
    border-radius:8px;
    padding:10px 14px;
    font-size:0.83rem;
    color:#f87171;
    margin-bottom:18px;
    text-align:center;
  }
  .error-msg.visible{display:block;}
  .loading{
    text-align:center;
    color:#8A8A8A;
    font-size:0.85rem;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="card-accent"></div>
  <div class="card-inner">
    <div class="logos-row">
      <div class="logo-pill">
        <div class="ir-name">INTER<span> </span>RURAL</div>
      </div>
    </div>
    <div class="card-heading">
      <h1>Órdenes de Servicio</h1>
      <p>Sistema de gestión · DJI Service Center</p>
    </div>
    
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="usuario@interrural.com" autocomplete="email"/>
    </div>
    
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"/>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <button class="btn-login" id="loginBtn">Iniciar sesión</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMsg');

// Login al hacer click
loginBtn.addEventListener('click', handleLogin);

// Login al presionar Enter
passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleLogin();
});

async function handleLogin() {
  const email = emailInput.value.trim();
  const pass = passwordInput.value;
  
  errorMsg.classList.remove('visible');
  
  if (!email || !pass) {
    showError('Completa email y contraseña');
    return;
  }
  
  loginBtn.disabled = true;
  loginBtn.textContent = 'Iniciando...';
  
  try {
    const result = await login(email, pass);
    
    if (result.success) {
      const rol = result.user.rol;
      
      // Redirigir según el rol
      if (rol === 'taller') {
        window.location.href = 'taller.html';
      } else if (rol === 'refacciones') {
        window.location.href = 'refacciones.html';
      } else if (rol === 'gerencia') {
        window.location.href = 'gerencia.html';
      } else {
        showError('Rol no reconocido: ' + rol);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Iniciar sesión';
      }
    } else {
      showError(result.error || 'Error de autenticación');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Iniciar sesión';
    }
  } catch (error) {
    showError('Error al conectar: ' + error.message);
    loginBtn.disabled = false;
    loginBtn.textContent = 'Iniciar sesión';
  }
}

function showError(message) {
  errorMsg.textContent = message;
  errorMsg.classList.add('visible');
}

// Verificar si ya hay sesión activa (auto-login)
(async function() {
  const session = await checkSession();
  if (session && session.rol) {
    const rol = session.rol;
    if (rol === 'taller') {
      window.location.href = 'taller.html';
    } else if (rol === 'refacciones') {
      window.location.href = 'refacciones.html';
    } else if (rol === 'gerencia') {
      window.location.href = 'gerencia.html';
    }
  }
})();
</script>
</body>
</html>
